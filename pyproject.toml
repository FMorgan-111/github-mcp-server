[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-mcp-server"
version = "0.1.0"
description = "GitHub MCP Agent Server — let AI agents operate GitHub through Model Context Protocol"
requires-python = ">=3.10"
dependencies = [
    "fastmcp",
    "httpx",
    "python-dotenv",
]

[project.scripts]
github-mcp = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
